[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "polars-pairing"
description = "Polars plugin with pairing functions for nonnegative integers"
authors = [{ name = "Antonio Camargo", email = "antoniop.camargo@gmail.com" }]
dynamic = ["version"]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["polars>=2.0,<3"]

[project.urls]
Homepage = "https://apcamargo.github.io/polars-pairing"
Repository = "https://github.com/apcamargo/polars-pairing"

[tool.maturin]
module-name = "polars_pairing._internal"
